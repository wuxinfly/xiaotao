name: Contracts

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  codex-windows:
    defaults:
      run:
        working-directory: xt-skills
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Codex plugin on Windows
        run: node --test test/codex-adapter.test.js

  agent-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test agent rule evolution
        run: node --test tools/agent-rules.test.mjs
      - name: Verify generated AGENTS.md and candidates
        run: node tools/agent-rules.mjs check

  verify:
    defaults:
      run:
        working-directory: xt-skills
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify multi-host CLI
        run: npm test
      - name: Verify schemas and behavioral contracts
        shell: pwsh
        run: ./scripts/verify-contracts.ps1
      - name: Verify npm package contents
        run: npm pack --dry-run
      - name: Install dsh-adapter dependencies
        run: npm install
        working-directory: xt-skills/adapters/deepseek-harness
      - name: Typecheck dsh-adapter
        run: npm run typecheck
        working-directory: xt-skills/adapters/deepseek-harness
      - name: Test dsh-adapter
        run: npm test
        working-directory: xt-skills/adapters/deepseek-harness
      - name: Verify dsh-adapter package
        run: npm run test:package
        working-directory: xt-skills/adapters/deepseek-harness
